name: Public website security audit

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 1'
  pull_request:
    paths:
      - '.github/workflows/public-site-security-audit.yml'
      - 'scripts/audit-public-site-security.py'

permissions:
  contents: read

jobs:
  site-security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit public security controls (report-only)
        run: python3 scripts/audit-public-site-security.py
