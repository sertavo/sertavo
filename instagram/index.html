<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sertavo Posts">

<title>Sertavo Instagram Generator</title>
<style>
:root{--navy:#0C2038;--brand:#074686;--cream:#F6EFE5;--cream2:#FFFDFC;--gold:#BE9158;--ink:#17283A;--muted:#69737B;--line:#D8C8B0;--bg:#ebe7df}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}
.app{min-height:100dvh;display:flex;flex-direction:column}.stage{order:1;padding:10px 8px;display:flex;justify-content:center;align-items:flex-start}.panel{order:2;background:white;padding:14px 12px calc(22px + env(safe-area-inset-bottom));border-top:1px solid #ddd}
canvas{width:min(88vw,350px);height:auto;display:block;background:var(--cream);box-shadow:0 14px 38px rgba(0,0,0,.17);border-radius:18px}
.header{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}.header h1{font-size:18px;margin:0;color:var(--brand)}.sub{font-size:12px;color:var(--muted);line-height:1.45;margin-top:3px}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef4f8;color:#27445f;white-space:nowrap}
.section{border-top:1px solid #eee;margin-top:12px;padding-top:12px}.section:first-of-type{border-top:0;margin-top:0;padding-top:0}.section h2{font-size:13px;color:var(--brand);margin:0 0 9px}label{display:block;font-size:12px;font-weight:700;margin:8px 0 5px}
input,textarea,select{width:100%;min-height:44px;border:1px solid #d8d8d8;border-radius:10px;padding:9px 10px;background:#fff;color:#222;font-size:16px}textarea{min-height:78px;resize:vertical;line-height:1.4}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.slides{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tabs button,.slides button{min-height:44px;border:1px solid #d8d8d8;background:#fff;color:#333;border-radius:9px;font-weight:700}.tabs button.active,.slides button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.colors button{height:44px;border-radius:10px;border:1px solid #ddd}.colors button.active{outline:3px solid var(--gold);outline-offset:1px}.note{font-size:12px;line-height:1.5;background:#eef4f8;color:#27445f;padding:9px 10px;border-radius:9px;margin-top:8px}.tiny{font-size:11px;color:#777;line-height:1.45;margin-top:5px}
.actions{display:flex;flex-wrap:wrap;gap:7px;position:sticky;bottom:calc(6px + env(safe-area-inset-bottom));z-index:20;margin-top:14px;padding:9px;background:rgba(255,255,255,.97);border:1px solid #e5e5e5;border-radius:13px;box-shadow:0 7px 20px rgba(0,0,0,.11)}.action,.fileBtn{flex:1 1 45%;min-height:46px;border:0;border-radius:10px;padding:10px 11px;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center}.action{background:var(--brand);color:#fff}.action.gold{background:var(--gold)}.action.gray,.fileBtn{background:#eee;color:#222}.fileBtn input{display:none}.status{font-size:11px;color:#666;margin-top:6px}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0}.switch input{width:auto;min-height:0}
@media(min-width:901px){.app{display:grid;grid-template-columns:minmax(380px,500px) 1fr;direction:ltr}.panel{order:1;direction:rtl;max-height:100vh;overflow:auto;border-top:0;border-right:1px solid #ddd;padding:18px}.stage{order:2;direction:rtl;padding:24px}canvas{width:min(58vw,540px);border-radius:24px}.row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<main class="stage"><canvas id="cv" width="1080" height="1350"></canvas></main>
<aside class="panel">
<div class="header"><div><h1>Sertavo Instagram Generator</h1><div class="sub">3 קרוסלות, 12 שקופיות, RTL, 1080×1350</div></div><span class="badge">MOBILE v1.1</span></div>

<div class="section"><h2>בחירת פוסט</h2><div class="tabs" id="carouselTabs"></div><div class="slides" id="slideTabs"></div><div class="note" id="role"></div></div>

<div class="section"><h2>טקסט</h2><label>כותרת</label><textarea id="title"></textarea><label>טקסט משני</label><textarea id="body"></textarea><label>שורת הבהרה</label><textarea id="support"></textarea><label>CTA טקסטואלי</label><input id="cta"></div>

<div class="section"><h2>גודל ומיקום</h2><div class="row"><div><label>גודל כותרת</label><input id="titleSize" type="number" min="38" max="100"></div><div><label>גודל גוף</label><input id="bodySize" type="number" min="24" max="62"></div></div><div class="row"><div><label>כותרת Y</label><input id="titleY" type="number" min="120" max="760"></div><div><label>גוף Y</label><input id="bodyY" type="number" min="250" max="1100"></div></div></div>

<div class="section"><h2>רקע</h2><div class="colors"><button data-bg="cream" style="background:#F6EFE5">שמנת</button><button data-bg="navy" style="background:#0C2038;color:white">Navy</button><button data-bg="photo" style="background:linear-gradient(135deg,#ddd,#8290a0)">תמונה</button></div><label>העלה רקע מה־Photos / Files</label><input id="bgFile" type="file" accept="image/png,image/jpeg,image/webp"><div class="row"><div><label>Zoom %</label><input id="bgZoom" type="number" min="80" max="220"></div><div><label>כהות %</label><input id="overlay" type="number" min="0" max="75"></div></div></div>

<div class="section"><h2>ויזואל</h2><label>סוג ויזואל</label><select id="visualType"><option value="none">ללא</option><option value="abstract">Quiet luxury</option><option value="skin">עור / ריסוס</option><option value="time">התפתחות לאורך זמן</option><option value="whatsapp">WhatsApp</option><option value="report">דוח התאמה</option><option value="score">ציון התאמה</option><option value="compare">השוואה</option><option value="list">רשימה RTL</option><option value="kit">ערכת התנסות</option></select><label>תמונה משלך במקום הוויזואל</label><input id="heroFile" type="file" accept="image/png,image/jpeg,image/webp"><div class="row"><div><label>גודל ויזואל %</label><input id="heroScale" type="number" min="30" max="150"></div><div><label>מיקום Y</label><input id="heroY" type="number" min="340" max="1120"></div></div></div>

<div class="section"><h2>התאמה / WhatsApp / ערכה</h2><div class="row"><div><label>ציון</label><input id="score" type="number" min="0" max="100"></div><div><label>תווית</label><input id="scoreLabel"></div></div><label>הודעת Sertavo</label><textarea id="waBrand"></textarea><label>תשובת הלקוח</label><input id="waCustomer"><label>טקסט בתוך מכסה הערכה</label><textarea id="kitLid"></textarea></div>

<div class="section"><h2>מיתוג</h2><label>לוגו שקוף משלך</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"><div class="row"><div><label>גודל לוגו %</label><input id="logoScale" type="number" min="35" max="150"></div><div><label>מיקום לוגו Y</label><input id="logoY" type="number" min="30" max="260"></div></div><label class="switch"><input id="showCounter" type="checkbox"> הצג 1/4</label></div>

<div class="note">באייפון: בסיום שקופית לחץ <strong>שתף PNG נוכחי</strong>, ואז בחר שמירה לתמונות או לקבצים.</div>
<div class="actions"><button class="action gold" id="share">שתף PNG נוכחי</button><button class="action" id="download">הורד PNG</button><label class="fileBtn">טען פרויקט<input id="loadProject" type="file" accept="application/json,.json"></label><button class="action gray" id="saveProject">שמור פרויקט</button><button class="action gray" id="resetSlide">איפוס שקופית</button><button class="action gray" id="resetAll">איפוס הכל</button></div><div class="status" id="status">נשמר אוטומטית במכשיר.</div>
</aside>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),W=1080,H=1350;
const C={navy:'#0C2038',brand:'#074686',cream:'#F6EFE5',cream2:'#FFFDFC',gold:'#BE9158',ink:'#17283A',muted:'#69737B',line:'#D8C8B0'};
const base=(o={})=>Object.assign({title:'',body:'',support:'',cta:'',bg:'cream',bgData:'',bgZoom:100,overlay:0,visualType:'none',heroData:'',heroScale:90,heroY:700,titleSize:68,bodySize:36,titleY:220,bodyY:620,score:89,scoreLabel:'ציון התאמה',waBrand:'',waCustomer:'',kitLid:'SELECTED\nFOR YOU',logoScale:70,logoY:60,showCounter:true},o);
const DEFAULTS=[
{label:'1 - למה Sertavo',role:'בעיה / Positioning',slides:[
base({title:'לפני שקונים, בודקים.',body:'דרך חכמה יותר לבחור בושם שמתאים לך.',visualType:'abstract',titleSize:74,titleY:300,bodyY:520,heroY:900,logoScale:86,logoY:92}),
base({title:'בושם משתנה על העור.',body:'מה שמרשים ברגע הראשון\nלא תמיד מרגיש כמוך\nאחרי כמה שעות.',bg:'navy',visualType:'skin',titleY:205,bodyY:790,heroY:505,titleSize:68}),
base({title:'הריסוס הראשון הוא רק ההתחלה.',body:'העור, מזג האוויר,\nאופי השימוש והזמן\nמשפיעים על איך שהבושם מתפתח.',visualType:'time',titleY:220,bodyY:790,heroY:500,titleSize:64}),
base({title:'רוצה לבדוק מה יכול להתאים לך?',body:'מתחילים בכמה שאלות קצרות בוואטסאפ.',cta:'בדיקת התאמה - לינק בביו',bg:'navy',visualType:'whatsapp',titleY:180,bodyY:980,heroY:555,titleSize:62,waBrand:'היי, כאן Sertavo 👋\nנעזור לך להבין איזה בושם יכול להתאים לך.',waCustomer:'אשמח להתחיל 🙂'})]},
{label:'2 - אמון',role:'Proof / Trust',slides:[
base({title:'לא עוד "נראה לי".\nמקבלים כיוון ברור.',body:'לא רק המלצה.\nגם הסבר למה.',visualType:'report',titleY:250,bodyY:500,heroY:860,titleSize:70}),
base({title:'כיוון מוביל שמתאים לך.',body:'כיוון נקי ומאסקי שמתחבר למה שאהבת.\nנוכחות עדינה שמורגשת בעיקר מקרוב.\nמתאים לשימוש יומיומי, אלגנטי ולא משתלט.',support:'הציון משקף עד כמה הכיוון מתאים למה שסיפרת לנו.',bg:'navy',visualType:'score',titleY:170,bodyY:790,heroY:515,titleSize:62}),
base({title:'כיוון נוסף להשוואה.',body:'רענן וצלול יותר מהכיוון המוביל,\nכדי להבין מה מרגיש נכון יותר על העור.',support:'הכיוון נועד להשוואה, לא דירוג או עדיפות.',visualType:'compare',titleY:205,bodyY:760,heroY:500,titleSize:65}),
base({title:'לא רק מה מתאים לך.\nגם למה.',body:'ההמלצה נשענת על מה שסיפרת לנו:\nמה אהבת, איך משתמשים בבושם\nומה חשוב לך בבחירה.',support:'כדי להבין מה שווה לנסות - ומה פחות.',cta:'בדיקת התאמה - לינק בביו',bg:'navy',titleY:220,bodyY:590,titleSize:66})]},
{label:'3 - איך זה עובד',role:'Ease / Conversion',slides:[
base({title:'איך עובדת בדיקת ההתאמה?',body:'פשוט יותר ממה שנדמה.',visualType:'whatsapp',titleY:220,bodyY:420,heroY:780,titleSize:68,waBrand:'היי, כאן Sertavo 👋\nנעזור לך להבין איזה בושם יכול להתאים לך.',waCustomer:'אשמח להתחיל 🙂'}),
base({title:'כמה שאלות קצרות.',body:'מה אהבת.\nאיך משתמשים בבושם.\nומה חשוב לך בבחירה.',bg:'navy',visualType:'list',titleY:190,bodyY:540,titleSize:70,bodySize:40}),
base({title:'מקבלים כיוון ברור.',body:'מה מתאים לך יותר.\nמה שווה להשוות.\nולמה.',visualType:'report',titleY:190,bodyY:500,heroY:900,titleSize:70,bodySize:40,heroScale:70}),
base({title:'ואם רלוונטי - ערכת התנסות.',body:'כדי לבדוק את הכיוונים על העור ולאורך זמן,\nלפני שמחליטים על בקבוק מלא.',cta:'בדיקת התאמה - לינק בביו',visualType:'kit',titleY:185,bodyY:1000,heroY:620,titleSize:64,bodySize:34,heroScale:96})]}
];
const clone=x=>JSON.parse(JSON.stringify(x));let state=clone(DEFAULTS),ci=0,si=0,logoData='';const STORE='sertavo_instagram_mobile_v11';
function cur(){return state[ci].slides[si]}function fileData(f,cb){if(!f)return;const r=new FileReader;r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function saveLocal(){try{localStorage.setItem(STORE,JSON.stringify({state,ci,si,logoData}))}catch(e){}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x?.state){state=x.state;ci=x.ci||0;si=x.si||0;logoData=x.logoData||''}}catch(e){}}
const fields=['title','body','support','cta','titleSize','bodySize','titleY','bodyY','bgZoom','overlay','visualType','heroScale','heroY','score','scoreLabel','waBrand','waCustomer','kitLid','logoScale','logoY'];
function tabs(){const ct=$('carouselTabs'),st=$('slideTabs');ct.innerHTML='';DEFAULTS.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.label;b.className=i===ci?'active':'';b.onclick=()=>{pull();ci=i;si=0;push()};ct.appendChild(b)});st.innerHTML='';for(let i=0;i<4;i++){const b=document.createElement('button');b.textContent=`${i+1}/4`;b.className=i===si?'active':'';b.onclick=()=>{pull();si=i;push()};st.appendChild(b)};$('role').textContent='תפקיד בפאנל: '+DEFAULTS[ci].role}
function push(){const s=cur();fields.forEach(id=>{$(id).value=s[id]??''});$('showCounter').checked=s.showCounter!==false;document.querySelectorAll('[data-bg]').forEach(b=>b.classList.toggle('active',b.dataset.bg===s.bg));tabs();render();saveLocal()}
function pull(){const s=cur();fields.forEach(id=>{const e=$(id);if(['titleSize','bodySize','titleY','bodyY','bgZoom','overlay','heroScale','heroY','score','logoScale','logoY'].includes(id))s[id]=Number(e.value)||0;else s[id]=e.value});s.showCounter=$('showCounter').checked;saveLocal()}
fields.forEach(id=>{$(id).addEventListener('input',()=>{pull();render()});$(id).addEventListener('change',()=>{pull();render()})});$('showCounter').onchange=()=>{pull();render()};document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{cur().bg=b.dataset.bg;push()});
$('bgFile').onchange=e=>fileData(e.target.files[0],d=>{cur().bgData=d;cur().bg='photo';push()});$('heroFile').onchange=e=>fileData(e.target.files[0],d=>{cur().heroData=d;push()});$('logoFile').onchange=e=>fileData(e.target.files[0],d=>{logoData=d;render();saveLocal()});
const cache=new Map;function loadImg(src){return new Promise(res=>{if(!src)return res(null);if(cache.has(src))return res(cache.get(src));const im=new Image;im.onload=()=>{cache.set(src,im);res(im)};im.onerror=()=>res(null);im.src=src})}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function line(x1,y1,x2,y2,col,w=2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke()}
function wrap(text,x,y,maxW,size,col,weight=500,align='center',lh=1.32){ctx.fillStyle=col;ctx.font=`${weight} ${size}px Arial`;ctx.textAlign=align;ctx.direction='rtl';let yy=y;for(const para of String(text||'').split('\n')){const words=para.split(' ');let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy);yy+=size*lh;line=word}else line=test}if(line)ctx.fillText(line,x,yy);yy+=size*lh}return yy}
function brandLogo(s,dark){if(logoData)return;const y=s.logoY,sc=s.logoScale/100;ctx.save();ctx.strokeStyle=C.gold;ctx.lineWidth=4*sc;ctx.beginPath();ctx.arc(W/2,y+48*sc,38*sc,0,Math.PI*2);ctx.stroke();ctx.fillStyle=C.gold;ctx.font=`600 ${43*sc}px Georgia`;ctx.textAlign='center';ctx.direction='ltr';ctx.fillText('S',W/2,y+30*sc);ctx.font=`500 ${24*sc}px Georgia`;ctx.fillText('S E R T A V O',W/2,y+96*sc);ctx.restore()}
async function uploadedLogo(s){if(!logoData)return;const im=await loadImg(logoData);if(!im)return;const sc=s.logoScale/100,maxW=280*sc,maxH=145*sc,r=Math.min(maxW/im.width,maxH/im.height),w=im.width*r,h=im.height*r;ctx.drawImage(im,(W-w)/2,s.logoY,w,h)}
function scoreRing(x,y,r,score,dark){ctx.save();ctx.lineWidth=20;ctx.strokeStyle=dark?'rgba(255,255,255,.18)':'#dfd7ca';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.strokeStyle=C.gold;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0,Math.min(100,score))/100);ctx.stroke();ctx.fillStyle=dark?C.cream:C.ink;ctx.font='800 72px Arial';ctx.textAlign='center';ctx.direction='ltr';ctx.fillText(String(score),x,y-28);ctx.font='600 28px Arial';ctx.fillText('/100',x,y+46);ctx.restore()}
function drawAbstract(s,dark){ctx.save();ctx.globalAlpha=.8;ctx.fillStyle=C.gold;ctx.beginPath();ctx.ellipse(350,s.heroY,170,70,-.5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.3;ctx.fillStyle=C.brand;ctx.beginPath();ctx.ellipse(670,s.heroY+70,210,88,.35,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.22;ctx.fillStyle=dark?C.cream:C.ink;ctx.beginPath();ctx.arc(530,s.heroY-40,95,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawSkin(s,dark){ctx.save();ctx.translate(W/2,s.heroY);ctx.rotate(-.12);rr(-270,-65,540,130,65,'#d4a27f');ctx.fillStyle=C.gold;ctx.globalAlpha=.65;for(let i=0;i<18;i++){ctx.beginPath();ctx.arc(35+i*15,-95-Math.sin(i)*18,5+i*.25,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawTime(s,dark){ctx.save();ctx.strokeStyle=C.gold;ctx.lineWidth=4;ctx.beginPath();ctx.arc(W/2,s.heroY,130,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(W/2,s.heroY);ctx.lineTo(W/2+10,s.heroY-82);ctx.moveTo(W/2,s.heroY);ctx.lineTo(W/2+68,s.heroY+28);ctx.stroke();ctx.restore()}
function drawWhatsapp(s){const sc=s.heroScale/100,w=455*sc,h=515*sc,x=W/2-w/2,y=s.heroY-h/2;rr(x,y,w,h,48*sc,'#111');rr(x+18*sc,y+18*sc,w-36*sc,h-36*sc,36*sc,'#e8f0e8');ctx.fillStyle='#fff';ctx.fillRect(x+18*sc,y+18*sc,w-36*sc,72*sc);ctx.fillStyle=C.ink;ctx.font=`700 ${25*sc}px Arial`;ctx.textAlign='center';ctx.direction='ltr';ctx.fillText('Sertavo',W/2,y+42*sc);const bw=w*.76,bx=x+w*.17,by=y+130*sc;rr(bx,by,bw,150*sc,20*sc,'#fff');wrap(s.waBrand,bx+bw-18*sc,by+18*sc,bw-36*sc,21*sc,C.ink,500,'right',1.28);const cw=w*.58,cx=x+w*.08,cy=y+320*sc;rr(cx,cy,cw,58*sc,18*sc,'#d9fdd3');ctx.fillStyle=C.ink;ctx.font=`600 ${20*sc}px Arial`;ctx.textAlign='center';ctx.direction='rtl';ctx.fillText(s.waCustomer||'אשמח להתחיל 🙂',cx+cw/2,cy+17*sc)}
function drawReport(s,dark,small=false){const sc=s.heroScale/100*(small?.75:1),w=650*sc,h=425*sc,x=W/2-w/2,y=s.heroY-h/2;rr(x,y,w,h,32*sc,C.cream2,'rgba(190,145,88,.35)');ctx.fillStyle=C.gold;ctx.font=`500 ${22*sc}px Georgia`;ctx.textAlign='center';ctx.direction='ltr';ctx.fillText('SERTAVO',W/2,y+32*sc);ctx.fillStyle=C.ink;ctx.font=`700 ${31*sc}px Arial`;ctx.direction='rtl';ctx.fillText('דוח התאמה אישי',W/2,y+78*sc);scoreRing(x+w*.28,y+h*.57,82*sc,s.score,false);ctx.textAlign='right';ctx.direction='rtl';ctx.fillStyle=C.ink;ctx.font=`700 ${25*sc}px Arial`;ctx.fillText('כיוון מוביל עבורך',x+w*.9,y+h*.43);ctx.font=`400 ${21*sc}px Arial`;ctx.fillStyle=C.muted;ctx.fillText('המלצה מנומקת',x+w*.9,y+h*.56);ctx.fillText('כיוון נוסף להשוואה',x+w*.9,y+h*.68)}
function drawCompare(s,dark){ctx.save();ctx.strokeStyle=dark?C.cream:C.ink;ctx.globalAlpha=.65;ctx.lineWidth=3;ctx.beginPath();ctx.arc(W/2-90,s.heroY,100,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(W/2+90,s.heroY,100,0,Math.PI*2);ctx.stroke();ctx.fillStyle=C.gold;ctx.globalAlpha=.16;ctx.beginPath();ctx.arc(W/2,s.heroY,120,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawList(s,dark){const ls=String(s.body||'').split('\n').filter(Boolean),col=dark?C.cream:C.ink;ls.forEach((t,i)=>{const y=s.bodyY+i*145;ctx.strokeStyle=C.gold;ctx.lineWidth=3;ctx.beginPath();ctx.arc(900,y-8,33,0,Math.PI*2);ctx.stroke();ctx.fillStyle=C.gold;ctx.font='700 28px Arial';ctx.textAlign='center';ctx.direction='ltr';ctx.fillText(['♡','◫','◇'][i%3],900,y-26);ctx.fillStyle=col;ctx.font=`700 ${s.bodySize}px Arial`;ctx.textAlign='right';ctx.direction='rtl';ctx.fillText(t,835,y-22)})}
function drawChecks(s,dark){const ls=String(s.body||'').split('\n').filter(Boolean),col=dark?C.cream:C.ink;ls.forEach((t,i)=>{const y=s.bodyY+i*92;ctx.fillStyle=C.gold;ctx.font='800 38px Arial';ctx.textAlign='right';ctx.direction='ltr';ctx.fillText('✓',900,y);ctx.fillStyle=col;ctx.font=`700 ${s.bodySize}px Arial`;ctx.textAlign='right';ctx.direction='rtl';ctx.fillText(t,840,y)})}
function drawKit(s){const sc=s.heroScale/100,w=650*sc,h=440*sc,x=W/2-w/2,y=s.heroY-h/2;ctx.fillStyle='#0a1c31';ctx.beginPath();ctx.moveTo(x+30,y+40);ctx.lineTo(x+w-30,y+40);ctx.lineTo(x+w-80,y+185);ctx.lineTo(x+80,y+185);ctx.closePath();ctx.fill();ctx.strokeStyle=C.gold;ctx.stroke();ctx.fillStyle=C.gold;ctx.font=`600 ${34*sc}px Georgia`;ctx.textAlign='center';ctx.direction='ltr';const lid=(s.kitLid||'SELECTED\nFOR YOU').split('\n');ctx.fillText(lid[0]||'SELECTED',W/2,y+88);ctx.fillText(lid[1]||'FOR YOU',W/2,y+130);rr(x+52,y+176,w-104,h-190,20*sc,'#0a1c31',C.gold);rr(x+95,y+220,w-190,h-265,16*sc,'#eadfce');for(let i=0;i<2;i++){const vx=W/2+(i?95:-95),vy=y+245;rr(vx-30,vy,60,132*sc,14*sc,'#f8f7f2','#c7b99e');rr(vx-28,vy-18,56,32*sc,8*sc,'#111');ctx.fillStyle=C.gold;ctx.font=`600 ${13*sc}px Georgia`;ctx.textAlign='center';ctx.direction='ltr';ctx.fillText('SERTAVO',vx,vy+50*sc)}}
async function background(s){const dark=s.bg==='navy';ctx.fillStyle=dark?C.navy:C.cream;ctx.fillRect(0,0,W,H);if(s.bg==='photo'&&s.bgData){const im=await loadImg(s.bgData);if(im){const scale=Math.max(W/im.width,H/im.height)*(s.bgZoom/100),w=im.width*scale,h=im.height*scale;ctx.drawImage(im,(W-w)/2,(H-h)/2,w,h);ctx.fillStyle=`rgba(12,32,56,${s.overlay/100})`;ctx.fillRect(0,0,W,H)}}else{ctx.save();ctx.globalAlpha=.06;ctx.fillStyle=dark?C.gold:C.ink;for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(80+i*95,180+i*55,180,28,-.7,0,Math.PI*2);ctx.fill()}ctx.restore()}return dark}
async function render(){const s=cur(),dark=await background(s);if(logoData)await uploadedLogo(s);else brandLogo(s,dark);const titleCol=dark?C.cream:C.ink,bodyCol=dark?'#f1ede7':C.ink;wrap(s.title,W/2,s.titleY,W*.82,s.titleSize,titleCol,800,'center',1.16);if(s.heroData){const im=await loadImg(s.heroData);if(im){const sc=s.heroScale/100,r=Math.min(760*sc/im.width,570*sc/im.height),w=im.width*r,h=im.height*r;ctx.save();ctx.beginPath();ctx.roundRect((W-w)/2,s.heroY-h/2,w,h,34);ctx.clip();ctx.drawImage(im,(W-w)/2,s.heroY-h/2,w,h);ctx.restore()}}else{if(s.visualType==='abstract')drawAbstract(s,dark);if(s.visualType==='skin')drawSkin(s,dark);if(s.visualType==='time')drawTime(s,dark);if(s.visualType==='whatsapp')drawWhatsapp(s);if(s.visualType==='report')drawReport(s,dark,ci===2&&si===2);if(s.visualType==='score'){scoreRing(W/2,s.heroY,145*s.heroScale/100,s.score,dark);ctx.fillStyle=dark?C.cream:C.ink;ctx.font='700 30px Arial';ctx.textAlign='center';ctx.direction='rtl';ctx.fillText(s.scoreLabel||'ציון התאמה',W/2,s.heroY+185)}if(s.visualType==='compare')drawCompare(s,dark);if(s.visualType==='kit')drawKit(s)}if(s.visualType==='list'&&ci===2&&si===1)drawList(s,dark);else if(ci===2&&si===2)drawChecks(s,dark);else if(s.body)wrap(s.body,W/2,s.bodyY,W*.78,s.bodySize,bodyCol,500,'center',1.36);if(s.support)wrap(s.support,W/2,1070,W*.76,28,dark?'#dadce0':C.muted,500,'center',1.32);if(s.cta){line(280,H-175,800,H-175,dark?'rgba(190,145,88,.5)':C.line,2);wrap(s.cta,W/2,H-135,W*.72,31,C.gold,800,'center',1.2)}if(s.showCounter){rr(28,H-88,104,55,18,C.navy,C.gold);ctx.fillStyle=C.gold;ctx.font='700 29px Arial';ctx.textAlign='center';ctx.direction='ltr';ctx.fillText(`${si+1}/4`,80,H-75)}}
function blob(){return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('PNG')),'image/png'))}function download(data,name){const a=document.createElement('a');a.href=data;a.download=name;document.body.appendChild(a);a.click();a.remove()}
$('share').onclick=async()=>{pull();await render();const name=`Sertavo_C${ci+1}_S${si+1}.png`;try{const b=await blob(),f=new File([b],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})&&navigator.share){await navigator.share({files:[f],title:'Sertavo Instagram Slide'});$('status').textContent='נפתח תפריט השיתוף.'}else download(cv.toDataURL('image/png'),name)}catch(e){if(e?.name!=='AbortError')$('status').textContent='השיתוף לא הצליח. נסה הורד PNG.'}}
$('download').onclick=async()=>{pull();await render();download(cv.toDataURL('image/png'),`Sertavo_C${ci+1}_S${si+1}.png`)};$('saveProject').onclick=()=>{pull();const b=new Blob([JSON.stringify({version:'1.1',state,logoData},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Sertavo_Instagram_Project.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('loadProject').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{try{const x=JSON.parse(r.result);state=x.state||x;logoData=x.logoData||'';ci=0;si=0;push()}catch(err){alert('קובץ לא תקין')}};r.readAsText(f)};$('resetSlide').onclick=()=>{state[ci].slides[si]=clone(DEFAULTS[ci].slides[si]);push()};$('resetAll').onclick=()=>{if(confirm('לאפס את כל 12 השקופיות?')){state=clone(DEFAULTS);logoData='';ci=0;si=0;push()}};
loadLocal();push();
</script>
