ummary::-webkit-details-marker{display:none}.inside{padding:0 14px 14px}label{font-size:12px;font-weight:800;display:block;margin:10px 0 5px}textarea,input{width:100%;border:1px solid #d8dce0;border-radius:10px;padding:11px;background:white;direction:rtl}textarea{min-height:72px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fileBtn{display:block;background:#f1f1f1;border-radius:10px;padding:12px;text-align:center;cursor:pointer;font-weight:800}.fileBtn input{display:none}.tiny{font-size:11px;color:var(--muted);line-height:1.4;margin-top:6px}.logoBox{display:flex;gap:10px;align-items:center}.logoBox img{width:92px;height:52px;object-fit:contain;background:var(--navy);border-radius:9px}.mini{display:flex;gap:6px;margin-top:8px}.mini button{border:0;border-radius:9px;padding:9px 12px;background:#eee;font-weight:800;cursor:pointer}.exportBar{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);padding:10px 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:5}.exportBar button{border:0;border-radius:11px;padding:13px;color:#fff;font-weight:900;cursor:pointer}.download{background:#07549A}.share{background:#C99A5A}.status{font-size:11px;text-align:center;color:var(--muted);margin-top:8px}.warn{background:#FFF7E8;border:1px solid #F0D6A8;padding:10px;border-radius:10px;font-size:11px;color:#7B5A2B;margin-top:10px}.fullMode .panel{display:none}.fullMode.app{grid-template-columns:1fr}.fullMode .stageInner{width:min(74vh,92vw);min-width:0}

<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),W=1080,H=1350;
const C={navy:'#0C2038',cream:'#F6EFE5',paper:'#FFFCF8',gold:'#BE9158',ink:'#17283A',muted:'#6D7780',line:'#D8C8B0'};
const BUILTIN_LOGO='../../logo.png';
const base=(o={})=>Object.assign({title:'',body:'',support:'',cta:'',heroData:'',titleScale:100,bodyScale:100,titleShift:0,visualShift:0,showCounter:true,score:89,scoreLabel:'ציון התאמה',waBrand:'היי, כאן Sertavo 👋\nנעזור לך להבין איזה בושם יכול להתאים לך.',waCustomer:'אשמח להתחיל 🙂',kitLid:'SELECTED\nFOR YOU'},o);
const DEFAULTS=[
 {label:'1 - למה Sertavo',role:'בעיה / Positioning',slides:[

  base({template:'c1s4',title:'רוצה לבדוק מה יכול להתאים לך?',body:'מתחילים בכמה שאלות קצרות בוואטסאפ.',cta:'בדיקת התאמה - לינק בביו'})]},
 {label:'2 - אמון',role:'Proof / Trust',slides:[
  base({template:'c2s1',title:'לא עוד "נראה לי".\nמקבלים כיוון ברור.',body:'לא רק המלצה. גם הסבר למה.'}),
  base({template:'c2s2',title:'כיוון מוביל שמתאים לך.',body:'כיוון נקי ומאסקי שמתחבר למה שאהבת.\nנוכחות עדינה שמורגשת בעיקר מקרוב.\nמתאים לשימוש יומיומי, אלגנטי ולא משתלט.',support:'הציון משקף עד כמה הכיוון מתאים למה שסיפרת לנו.',score:89}),
  base({template:'c2s3',title:'כיוון נוסף להשוואה.',body:'רענן וצלול יותר מהכיוון המוביל, כדי להבין מה מרגיש נכון יותר על העור.',support:'הכיוון נועד להשוואה, לא דירוג או עדיפות.'}),
  base({template:'c2s4',title:'לא רק מה מתאים לך.\nגם למה.',body:'מה אהבת.\nאיך משתמשים בבושם.\nומה חשוב לך בבחירה.',support:'כדי להבין מה שווה לנסות - ומה פחות.',cta:'בדיקת התאמה - לינק בביו'})]},
 {label:'3 - איך זה עובד',role:'Ease / Conversion',slides:[

  base({template:'c3s3',title:'מקבלים כיוון ברור.',body:'מה מתאים לך יותר.\nמה שווה להשוות.\nולמה.'}),
  base({template:'c3s4',title:'ואם רלוונטי - ערכת התנסות.',body:'כדי לבדוק את הכיוונים על העור ולאורך זמן, לפני שמחליטים על בקבוק מלא.',cta:'בדיקת התאמה - לינק בביו'})]}
];
const clone=o=>JSON.parse(JSON.stringify(o));
let project={carousels:clone(DEFAULTS),logoData:BUILTIN_LOGO};
try{const p=JSON.parse(localStorage.getItem('sertavoIGv121')||'null');if(p?.carousels)project=p}catch(e){}
let ci=0,si=0,logoImg=null,heroImg=null,full=false;
const current=()=>project.carousels[ci].slides[si];
function save(){try{localStorage.setItem('sertavoIGv121',JSON.stringify(project));$('status').textContent='נשמר אוטומטית במכשיר.'}catch(e){$('status').textContent='השמירה המקומית נכשלה.'}}
function loadImage(src){return new Promise((res,rej)=>{if(!src)return res(null);const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function refresh(){try{logoImg=await loadImage(project.logoData||BUILTIN_LOGO)}catch(e){logoImg=null}heroImg=null;if(current().heroData)try{heroImg=await loadImage(current().heroData)}catch(e){}$('logoPreview').src=project.logoData||BUILTIN_LOGO;render()}
function rr(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function line(x1,y1,x2,y2,c,lw=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.stroke()}
function circle(x,y,r,fill,stroke,lw=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function font(s,w=500){return `${w} ${s}px Arial, Noto Sans Hebrew, sans-serif`}
function wrap(text,maxW,size,weight=500){ctx.font=font(size,weight);const lines=[];for(const p of String(text||'').split('\n')){const words=p.split(' ');let l='';for(const word of words){const t=l?l+' '+word:word;if(ctx.measureText(t).width>maxW&&l){lines.push(l);l=word}else l=t}if(l)lines.push(l)}return lines}
function text(text,x,y,maxW,size,color,weight=500,lineH=1.35,align='center'){ctx.save();ctx.direction='rtl';ctx.textAlign=align;ctx.textBaseline='top';ctx.fillStyle=color;ctx.font=font(size,weight);let yy=y;for(const l of wrap(text,maxW,size,weight)){ctx.fillText(l,x,yy);yy+=size*lineH}ctx.restore();return yy}
function bg(color){ctx.clearRect(0,0,W,H);ctx.fillStyle=color;ctx.fillRect(0,0,W,H)}
function drawLogo(y=48,w=150){if(!logoImg)return;const h=w*(logoImg.height/logoImg.width);ctx.drawImage(logoImg,(W-w)/2,y,w,h)}
function title(t,y,color,size=62){return text(t,540,y,860,size*(current().titleScale/100),color,800,1.17)}
function body(t,y,color,size=31,maxW=720){return text(t,540,y,maxW,size*(current().bodyScale/100),color,500,1.42)}
function counter(){if(!current().showCounter)return;ctx.save();ctx.direction='ltr';ctx.textAlign='left';ctx.font=font(19,700);ctx.fillStyle=C.gold;ctx.fillText(`${si+1}/4`,62,1285);ctx.restore()}
function cover(im,x,y,w,h){const sc=Math.max(w/im.width,h/im.height),dw=im.width*sc,dh=im.height*sc;ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}
function photo(im,x,y,w,h,r=26){ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.clip();cover(im,x,y,w,h);ctx.restore();rr(x,y,w,h,r,null,'rgba(190,145,88,.45)',2)}
function shadowCard(x,y,w,h,r=26){ctx.save();ctx.shadowColor='rgba(23,40,58,.16)';ctx.shadowBlur=24;ctx.shadowOffsetY=10;rr(x,y,w,h,r,C.paper);ctx.restore();rr(x,y,w,h,r,C.paper,'rgba(190,145,88,.28)',2)}
function phone(x,y,w,h){ctx.save();ctx.shadowColor='rgba(0,0,0,.2)';ctx.shadowBlur=24;ctx.shadowOffsetY=8;rr(x,y,w,h,40,'#111');ctx.restore();rr(x+10,y+10,w-20,h-20,30,'#EAF2EA');rr(x+10,y+10,w-20,58,28,'#fff');text('Sertavo',x+w/2,y+27,w-80,20,C.ink,800);rr(x+45,y+100,w-90,152,20,'#fff');text(current().waBrand,x+w-62,y+122,w-125,23,C.ink,500,1.35,'right');rr(x+48,y+282,w-112,61,18,'#D6F7C5');text(current().waCustomer,x+70,y+299,w-160,22,C.ink,700,1.2,'left')}
function scoreRing(cx,cy,r,score,light=false){ctx.save();ctx.lineCap='round';ctx.strokeStyle=light?'rgba(255,255,255,.18)':'#E8DFD3';ctx.lineWidth=16;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.strokeStyle=C.gold;ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*score/100);ctx.stroke();ctx.textAlign='center';ctx.fillStyle=light?'#fff':C.ink;ctx.font=font(70,800);ctx.fillText(score,cx,cy+18);ctx.font=font(20,800);ctx.fillText('/100',cx,cy+55);ctx.restore()}
function reportCard(x,y,w,h){shadowCard(x,y,w,h,24);text('SERTAVO',x+w/2,y+28,w-40,18,C.gold,700);text('דוח התאמה אישי',x+w/2,y+60,w-40,24,C.ink,800);scoreRing(x+125,y+165,70,current().score||89);text('כיוון מוביל עבורך',x+w-52,y+128,w-250,20,C.ink,800,1.25,'right');text('התאמה גבוהה\nכיוון נוסף להשוואה',x+w-52,y+174,w-250,16,C.muted,500,1.5,'right')}
function check(x,y,label,color=C.ink){circle(x,y,15,null,C.gold,2);ctx.save();ctx.strokeStyle=C.gold;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-7,y);ctx.lineTo(x-1,y+6);ctx.lineTo(x+8,y-7);ctx.stroke();ctx.restore();text(label,x-35,y-18,520,27,color,700,1.2,'right')}

function template_c1s2(){bg(C.navy);drawLogo();title(current().title,165,'#fff',64);const y=630+current().visualShift;if(heroImg){photo(heroImg,250,390,580,470,34)}else{ctx.save();const g=ctx.createLinearGradient(240,y-120,840,y+150);g.addColorStop(0,'#EDBE9A');g.addColorStop(1,'#C98C6A');ctx.strokeStyle=g;ctx.lineWidth=115;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(285,y+55);ctx.quadraticCurveTo(515,y-60,795,y+10);ctx.stroke();ctx.restore();for(let i=0;i<15;i++){const px=390+i*25,py=y-165-Math.sin(i*.75)*42;circle(px,py,4+(i%3),C.gold)}line(540,y-170,540,y-90,'rgba(255,255,255,.7)',2);text('על העור',540,y-255,260,18,C.gold,800)}body(current().body,895,'#fff',28,680);counter()}
function template_c1s3(){bg(C.cream);drawLogo();title(current().title,160,C.ink,60);const cy=610+current().visualShift;circle(540,cy,170,null,C.gold,4);circle(540,cy,148,null,'rgba(190,145,88,.22)',1);line(540,cy,540,cy-103,C.gold,4);line(540,cy,625,cy+50,C.gold,4);circle(540,cy,8,C.gold);['0h','2h','6h','8h'].forEach((v,i)=>{const a=-Math.PI/2+i*Math.PI/2;const x=540+Math.cos(a)*215,y=cy+Math.sin(a)*215;text(v,x,y-14,80,18,C.gold,800)});body(current().body,880,C.ink,28,720);counter()}

function template_c2s1(){bg(C.cream);drawLogo();title(current().title,155,C.ink,61);body(current().body,390,C.muted,28);reportCard(235,565+current().visualShift,610,350);counter()}
function template_c2s2(){bg(C.navy);drawLogo();title(current().title,155,'#fff',60);scoreRing(540,430+current().visualShift,115,current().score||89,true);text('ציון התאמה',540,570+current().visualShift,360,20,'#fff',800);body(current().body,670,'#fff',27,720);text(current().support,540,1030,740,18,'rgba(255,255,255,.7)',500);counter()}
function template_c2s3(){bg(C.cream);drawLogo();title(current().title,155,C.ink,60);const y=430+current().visualShift;shadowCard(130,y,350,350,24);shadowCard(600,y,350,350,24);circle(305,y+90,42,'rgba(190,145,88,.16)',C.gold,2);circle(775,y+90,42,'rgba(12,32,56,.06)',C.navy,2);text('הכיוון המוביל',305,y+155,280,25,C.ink,800);text('נקי · מאסקי · קרוב',305,y+205,280,20,C.muted,500);text('כיוון להשוואה',775,y+155,280,25,C.ink,800);text('רענן · צלול · פתוח',775,y+205,280,20,C.muted,500);text('להשוות על העור',540,y+395,400,22,C.gold,800);body(current().body,900,C.ink,27,760);text(current().support,540,1070,720,17,C.muted,500);counter()}
function template_c2s4(){bg(C.navy);drawLogo();title(current().title,150,'#fff',60);const labels=String(current().body||'').split('\n').filter(Boolean);labels.slice(0,3).forEach((l,i)=>check(770,485+i*112,l,'#fff'));line(390,875,690,875,C.gold,1);text(current().support,540,915,680,22,'#fff',700);text(current().cta,540,1080,600,22,C.gold,800);counter()}
function template_c3s1(){bg(C.cream);drawLogo();title(current().title,150,C.ink,60);body(current().body,310,C.muted,26);phone(295,410+current().visualShift,490,500);counter()}
function template_c3s2(){bg(C.cream);drawLogo();title(current().title,160,C.ink,60);const labels=String(current().body||'').split('\n').filter(Boolean);labels.slice(0,3).forEach((l,i)=>{rr(145,390+i*150,790,92,22,C.paper,'rgba(190,145,88,.35)',2);circle(865,436+i*150,25,null,C.gold,2);text(['♡','◷','≡'][i],865,417+i*150,50,24,C.ink,700);text(l,810,413+i*150,590,28,C.ink,800,1.2,'right')});counter()}
function template_c3s3(){bg(C.navy);drawLogo();title(current().title,150,'#fff',60);const labels=String(current().body||'').split('\n').filter(Boolean);labels.slice(0,3).forEach((l,i)=>check(820,400+i*90,l,'#fff'));reportCard(260,720+current().visualShift,560,315);counter()}
function template_c3s4(){bg(C.cream);drawLogo();title(current().title,145,C.ink,56);body(current().body,305,C.ink,25,760);const y=500+current().visualShift;if(heroImg){photo(heroImg,235,y,610,440,30);text('צילום הערכה האמיתי',540,y+465,520,18,C.gold,700)}else{ctx.save();ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=24;ctx.shadowOffsetY=10;rr(235,y+110,610,285,28,C.navy);ctx.restore();ctx.save();ctx.translate(540,y+150);ctx.rotate(-.08);rr(-305,-130,610,180,24,'#112A48',C.gold,2);ctx.restore();text('SELECTED\nFOR YOU',540,y+55,350,28,C.gold,800,1.2);rr(315,y+195,450,150,18,'#F3E7DA');for(const x of [455,625]){rr(x-25,y+220,50,115,18,'#fff','#bbb',2);rr(x-25,y+210,50,28,8,'#17191B')}text('להחליף בצילום האב־טיפוס לפני פרסום',540,y+430,700,18,C.muted,600)}text(current().cta,540,1110,620,22,C.gold,800);counter()}
const templates={c1s1:template_c1s1,c1s2:template_c1s2,c1s3:template_c1s3,c1s4:template_c1s4,c2s1:template_c2s1,c2s2:template_c2s2,c2s3:template_c2s3,c2s4:template_c2s4,c3s1:template_c3s1,c3s2:template_c3s2,c3s3:template_c3s3,c3s4:template_c3s4};
function render(){(templates[current().template]||template_c1s1)()}
function drawTabs(){const c=$('carouselTabs');c.innerHTML='';project.carousels.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x.label;b.className=i===ci?'active':'';b.onclick=()=>{ci=i;si=0;setForm()};c.appendChild(b)});const s=$('slideTabs');s.innerHTML='';for(let i=0;i<4;i++){const b=document.createElement('button');b.textContent=`${i+1}/4`;b.className=i===si?'active':'';b.onclick=()=>{si=i;setForm()};s.appendChild(b)}}
function renderSpecial(){const s=current(),box=$('specialFields');box.innerHTML='';if(['c1s4','c3s1'].includes(s.template)){box.innerHTML='<label>הודעת Sertavo</label><textarea id="wb"></textarea><label>תשובת הלקוח</label><input id="wc">';setTimeout(()=>{wb.value=s.waBrand;wc.value=s.waCustomer;wb.oninput=e=>upd('waBrand',e.target.value);wc.oninput=e=>upd('waCustomer',e.target.value)},0)}else if(s.template==='c2s2'){box.innerHTML='<label>ציון התאמה</label><input id="score" type="number" min="0" max="100">';setTimeout(()=>{score.value=s.score;score.oninput=e=>upd('score',Math.max(0,Math.min(100,Number(e.target.value))))},0)}else if(s.template==='c3s4'){box.innerHTML='<div class="tiny"><strong>חובה לפני פרסום:</strong> להעלות את צילום ערכת ההתנסות האמיתי. האיור הוא placeholder QA בלבד.</div>'}else box.innerHTML='<div class="tiny">אין שדות מיוחדים בשקופית הזו.</div>'}
function setForm(){const s=current();for(const id of ['title','body','support','cta','titleScale','bodyScale','titleShift','visualShift'])$(id).value=s[id]??'';$('showCounter').checked=!!s.showCounter;$('role').textContent='תפקיד בפאנל: '+project.carousels[ci].role;$('imageHint').textContent=({c1s2:'עדיפות לצילום מקורי של ריסוס על העור. בלי תמונה, מוצג fallback משופר.',c3s4:'חובה להחליף בצילום הערכה האמיתי לפני פרסום.',c3s1:'המוקאפ מובנה. אין צורך בתמונה.'}[s.template]||'אופציונלי.');renderSpecial();drawTabs();refresh()}
function upd(k,v){current()[k]=v;save();refresh()}
for(const id of ['title','body','support','cta','titleScale','bodyScale','titleShift','visualShift'])$(id).addEventListener('input',e=>upd(id,e.target.type==='number'?Number(e.target.value):e.target.value));$('showCounter').onchange=e=>upd('showCounter',e.target.checked);
function fileData(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
$('heroFile').onchange=e=>fileData(e.target.files[0],d=>{current().heroData=d;save();refresh();$('status').textContent='התמונה נטענה בהצלחה.'});$('clearHero').onclick=()=>{current().heroData='';$('heroFile').value='';save();refresh()};
$('logoFile').onchange=e=>fileData(e.target.files[0],d=>{project.logoData=d;save();$('logoStatus').textContent='הלוגו שהעלית פעיל';refresh()});$('restoreLogo').onclick=()=>{project.logoData=BUILTIN_LOGO;save();$('logoStatus').textContent='לוגו מובנה פעיל';refresh()};
function blob(){return new Promise(r=>cv.toBlob(r,'image/png',1))}
$('download').onclick=async()=>{const b=await blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`Sertavo_v121_C${ci+1}_S${si+1}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('share').onclick=async()=>{const b=await blob(),f=new File([b],`Sertavo_v121_C${ci+1}_S${si+1}.png`,{type:'image/png'});try{if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:'Sertavo'});else $('download').click()}catch(e){if(e.name!=='AbortError')$('download').click()}};
$('fullPreview').onclick=()=>{full=!full;$('app').classList.toggle('fullMode',full);$('fullPreview').textContent=full?'חזור לעריכה':'תצוגה מלאה'};
setForm();
</script>
</body>
</html>
