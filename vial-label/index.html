<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>מחולל מדבקות בקבוקונים - Sertavo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3eee4;font-family:Arial,sans-serif;color:#17212B}
.box{width:min(88vw,400px);background:#fff;padding:26px;border-radius:18px;box-shadow:0 16px 50px #0002}
h1{margin:0 0 7px;color:#074686;font-size:25px}p{color:#66717B;line-height:1.55;font-size:14px}
button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:#B89558;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.google{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#17212B;border:1px solid #d8d8d8}
.google svg{width:20px;height:20px;flex:0 0 20px}
.msg{margin-top:12px;padding:10px;border-radius:9px;background:#f5f5f5;font-size:13px;line-height:1.45}.bad{background:#fff1f1;color:#a33}.good{background:#eef8f2;color:#2F6B4F}
.small{font-size:12px}.hidden{display:none}
</style>
</head>
<body>
<div class="box">
<h1>מחולל מדבקות בקבוקונים</h1>
<p id="intro">כניסה לאזור התפעולי של Sertavo. הגישה מוגבלת לחשבונות Google שאושרו.</p>
<div id="login">
<button id="google" class="google" type="button" aria-label="המשך עם Google">
<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.24-.2-1.79H12v3.43h5.52a4.72 4.72 0 0 1-2.05 3.09l-.02.12 2.98 2.31.21.02c1.92-1.77 3.02-4.38 3.02-7.18Z"/><path fill="#34A853" d="M12 22c2.74 0 5.04-.9 6.72-2.45l-3.2-2.48c-.86.58-2 1-3.52 1-2.64 0-4.88-1.78-5.68-4.25l-.12.01-3.1 2.4-.04.11A10.15 10.15 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.32 13.82a6.08 6.08 0 0 1-.34-2c0-.7.12-1.38.33-2.02l-.01-.14-3.14-2.44-.1.05A10.18 10.18 0 0 0 2 11.82c0 1.64.39 3.2 1.06 4.55l3.26-2.55Z"/><path fill="#EA4335" d="M12 5.57c1.91 0 3.2.82 3.94 1.5l2.84-2.78C17.03 2.65 14.74 1.65 12 1.65a10.15 10.15 0 0 0-8.94 5.62l3.25 2.53C7.12 7.35 9.36 5.57 12 5.57Z"/></svg>
<span>המשך עם Google</span>
</button>
</div>
<div id="loading" class="msg hidden">טוען את המחולל...</div>
<div id="msg" class="msg hidden"></div>
</div>
<script>
const SB_URL="https://nyedulxukszcwmwsuuxw.supabase.co";
const SB_KEY="sb_publishable_mQNwiQoN56Zn_WQyqXzHcQ_g86AruZT";
const FN=SB_URL+"/functions/v1/vial-label-admin";
const REDIRECT_URL="https://sertavo.co/vial-label/";
const ALLOWED_EMAILS=new Set(["shlomielberg@gmail.com","sertavo.perfumes@gmail.com"]);
const client=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
function message(t,k=""){const m=$("msg");m.textContent=t;m.className="msg"+(k?" "+k:"");m.classList.remove("hidden")}
async function renderProtectedPage(page){
  const parsed=new DOMParser().parseFromString(page,"text/html");
  const scriptDefs=[...parsed.querySelectorAll("script")].map(s=>({
    src:s.getAttribute("src"),
    type:s.getAttribute("type"),
    text:s.textContent||""
  }));
  parsed.querySelectorAll("script").forEach(s=>s.remove());

  document.documentElement.lang=parsed.documentElement.lang||"he";
  document.documentElement.dir=parsed.documentElement.dir||"rtl";
  document.title=parsed.title||"Sertavo";

  document.head.innerHTML=parsed.head.innerHTML;
  document.body.innerHTML=parsed.body.innerHTML;

  for(const def of scriptDefs){
    if(def.src){
      await new Promise((resolve,reject)=>{
        const s=document.createElement("script");
        s.src=def.src;
        if(def.type)s.type=def.type;
        s.onload=resolve;
        s.onerror=()=>reject(new Error("script load failed"));
        document.head.appendChild(s);
      });
    }else if(def.text.trim()){
      const s=document.createElement("script");
      if(def.type)s.type=def.type;
      s.textContent=def.text;
      document.body.appendChild(s);
    }
  }
}
async function openGenerator(session){
  $("login").classList.add("hidden");$("loading").classList.remove("hidden");
  const email=(session?.user?.email||"").toLowerCase();
  if(!ALLOWED_EMAILS.has(email)){
    await client.auth.signOut();
    $("loading").classList.add("hidden");$("login").classList.remove("hidden");
    message("חשבון Google הזה אינו מורשה. בחר באחד משני החשבונות שאושרו.","bad");
    return;
  }
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),12000);
    const r=await fetch(FN,{
      method:"GET",
      mode:"cors",
      headers:{Authorization:"Bearer "+session.access_token},
      signal:controller.signal
    });
    clearTimeout(timer);
    if(r.status===403){
      await client.auth.signOut();
      $("loading").classList.add("hidden");$("login").classList.remove("hidden");
      message("החשבון הזה אינו מורשה להיכנס למחולל.","bad");
      return;
    }
    if(!r.ok){
      $("loading").classList.add("hidden");$("login").classList.remove("hidden");
      message("המחולל החזיר שגיאה "+r.status+". נסה שוב.","bad");
      return;
    }
    const page=await r.text();
    await renderProtectedPage(page);
  }catch(err){
    $("loading").classList.add("hidden");$("login").classList.remove("hidden");
    const timeout=err&&err.name==="AbortError";
    message(timeout?"טעינת המחולל ארכה יותר מדי. רענן את העמוד ונסה שוב.":"לא הצלחתי להתחבר למחולל. רענן את העמוד ונסה שוב.","bad");
  }
}
async function boot(){
  const {data:{session}}=await client.auth.getSession();
  if(session){await openGenerator(session);return}
  client.auth.onAuthStateChange(async(_,s)=>{if(s)await openGenerator(s)});
}
$("google").onclick=async()=>{
  const btn=$("google");
  btn.disabled=true;
  message("מעביר ל-Google לבחירת חשבון...","good");
  const {error}=await client.auth.signInWithOAuth({
    provider:"google",
    options:{
      redirectTo:REDIRECT_URL,
      queryParams:{prompt:"select_account"}
    }
  });
  if(error){
    btn.disabled=false;
    message("לא הצלחתי להתחיל כניסה עם Google: "+error.message,"bad");
  }
};
boot();
</script>
</body></html>
