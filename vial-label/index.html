<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>מחולל מדבקות בקבוקונים - Sertavo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3eee4;font-family:Arial,sans-serif;color:#17212B}
.box{width:min(88vw,400px);background:#fff;padding:26px;border-radius:18px;box-shadow:0 16px 50px #0002}
h1{margin:0 0 7px;color:#074686;font-size:25px}p{color:#66717B;line-height:1.55;font-size:14px}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:#B89558;color:#fff;font-weight:700;font-size:16px}
.msg{margin-top:12px;padding:10px;border-radius:9px;background:#f5f5f5;font-size:13px;line-height:1.45}.bad{background:#fff1f1;color:#a33}.good{background:#eef8f2;color:#2F6B4F}
.small{font-size:12px}.hidden{display:none}
</style>
</head>
<body>
<div class="box">
<h1>מחולל מדבקות בקבוקונים</h1>
<p id="intro">כניסה לאזור התפעולי של Sertavo. כרגע הכניסה היא בקישור חד-פעמי למייל מאושר; Google OAuth יחליף את המסך הזה כשהחיבור יושלם.</p>
<div id="login">
<input id="email" type="email" autocomplete="email" placeholder="המייל המאושר שלך">
<button id="send">שלח קישור כניסה</button>
</div>
<div id="loading" class="msg hidden">טוען את המחולל...</div>
<div id="msg" class="msg hidden"></div>
</div>
<script>
const SB_URL="https://nyedulxukszcwmwsuuxw.supabase.co";
const SB_KEY="sb_publishable_mQNwiQoN56Zn_WQyqXzHcQ_g86AruZT";
const FN=SB_URL+"/functions/v1/vial-label-admin";
const client=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
function message(t,k=""){const m=$("msg");m.textContent=t;m.className="msg"+(k?" "+k:"");m.classList.remove("hidden")}
async function openGenerator(session){
  $("login").classList.add("hidden");$("loading").classList.remove("hidden");
  const r=await fetch(FN,{headers:{Authorization:"Bearer "+session.access_token}});
  if(r.status===403){$("loading").classList.add("hidden");message("החשבון הזה אינו מורשה להיכנס למחולל.","bad");return}
  if(!r.ok){$("loading").classList.add("hidden");message("לא הצלחתי לטעון את המחולל. נסה להיכנס מחדש.","bad");return}
  const html=await r.text();document.open();document.write(html);document.close();
}
async function boot(){
  const {data:{session}}=await client.auth.getSession();
  if(session){await openGenerator(session);return}
  client.auth.onAuthStateChange(async(_,s)=>{if(s)await openGenerator(s)});
}
$("send").onclick=async()=>{
  const email=$("email").value.trim();if(!email){message("הזן כתובת מייל.","bad");return}
  $("send").disabled=true;
  const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});
  $("send").disabled=false;
  if(error){message("לא הצלחתי לשלוח קישור כניסה: "+error.message,"bad");return}
  message("שלחתי קישור כניסה למייל. פתח אותו באותו מכשיר ואז תחזור לכאן.","good");
};
boot();
</script>
</body></html>
